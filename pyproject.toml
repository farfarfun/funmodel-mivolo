[project]
name = "funmodel-mivolo"
version = "0.0.9"
description = "Layer MiVOLO for SOTA age and gender recognition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "funmodel",
    "fundrive[oss]>=2.0",
    "funget>=1.1",
    "huggingface_hub",
    "ultralytics==8.0.124",
    "timm==0.8.13.dev0",
    "yt_dlp",
    "lapx>=0.5.2",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funmodel"]
